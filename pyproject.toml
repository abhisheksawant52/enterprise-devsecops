[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-devsecops"
version = "0.1.0"
description = "Enterprise DevSecOps platform: centralized policy, scanning orchestration, and deployment gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["devsecops", "security", "policy-as-code", "sast", "sca", "deployment-gate"]
dependencies = [
  "click>=8.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7"]

[project.scripts]
edsec = "enterprise_devsecops.cli:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/enterprise-devsecops"
Issues = "https://github.com/abhisheksawant52/enterprise-devsecops/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
